<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Espaço Sorriso - Confirmação de pacientes</title>
    <link rel="stylesheet" href="src/css/popup.css"/>
</head>
<body>
    <div class="general">
        <header>
            <img src="src/img/logo.png"/>
        </header>
        <main class="principal">
            <div class="btn-confirm">
                <input type="button" value="Confirmar pacientes">
            </div>
            <div class="loading">
                <div class="loading__info">
                    <img src="src/img/loading.svg"/>
                    <span>
                        Confirmando pacientes, aguarde!
                    </span>
                </div>
                <div class="loading__patient-content">
                    <div class="loading__patient">
                        <input type="text" placeholder="Nome do paciente" disabled/>
                        <input type="text" placeholder="Telefone do paciente" disabled/>
                        <input type="text" placeholder="Horário do paciente" disabled/>
                        <input type="text" placeholder="Doutor(a) que irá atender" disabled/>
                        <textarea placeholder="Mensagem de confirmação" disabled></textarea>
                    </div>
                </div>
                <div class="btn-cancel">
                    <input type="button" value="Cancelar confirmação">
                </div>
            </div>
        </main>
    </div>
    <script src="src/js/popup.js"></script>
</body>
</html>
